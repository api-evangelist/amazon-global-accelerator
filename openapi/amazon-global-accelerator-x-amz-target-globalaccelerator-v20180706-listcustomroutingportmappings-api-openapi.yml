components:
  parameters:
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  schemas:
    EndpointGroupNotFoundException: {}
    InternalServiceErrorException: {}
    CustomRoutingProtocols:
      type: array
      items:
        $ref: '#/components/schemas/CustomRoutingProtocol'
      minItems: 1
      maxItems: 2
    SocketAddress:
      type: object
      properties:
        IpAddress:
          allOf:
          - $ref: '#/components/schemas/GenericString'
          - description: The IP address for the socket address.
        Port:
          allOf:
          - $ref: '#/components/schemas/PortNumber'
          - description: The port for the socket address.
      description: An IP address/port combination.
    PortMappingsMaxResults:
      type: integer
      minimum: 1
      maximum: 20000
    InvalidArgumentException: {}
    InvalidNextTokenException: {}
    PortMapping:
      type: object
      properties:
        AcceleratorPort:
          allOf:
          - $ref: '#/components/schemas/PortNumber'
          - description: The accelerator port.
        EndpointGroupArn:
          allOf:
          - $ref: '#/components/schemas/GenericString'
          - description: The Amazon Resource Name (ARN) of the endpoint group.
        EndpointId:
          allOf:
          - $ref: '#/components/schemas/GenericString'
          - description: The IP address of the VPC subnet (the subnet ID).
        DestinationSocketAddress:
          allOf:
          - $ref: '#/components/schemas/SocketAddress'
          - description: The EC2 instance IP address and port number in the virtual private cloud (VPC) subnet.
        Protocols:
          allOf:
          - $ref: '#/components/schemas/CustomRoutingProtocols'
          - description: The protocols supported by the endpoint group.
        DestinationTrafficState:
          allOf:
          - $ref: '#/components/schemas/CustomRoutingDestinationTrafficState'
          - description: Indicates whether or not a port mapping destination can receive traffic. The value is either ALLOW, if traffic is allowed to the destination, or DENY, if traffic is not allowed to the destination.
      description: 'Returns the ports and associated IP addresses and ports of Amazon EC2 instances in your virtual private cloud (VPC) subnets. Custom routing is a port mapping protocol in Global Accelerator that statically associates port ranges with VPC subnets, which allows Global Accelerator to route to specific instances and ports within one or more subnets. '
    ListCustomRoutingPortMappingsResponse:
      type: object
      properties:
        PortMappings:
          allOf:
          - $ref: '#/components/schemas/PortMappings'
          - description: The port mappings for a custom routing accelerator.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/GenericString'
          - description: The token for the next set of results. You receive this token from a previous call.
    ListCustomRoutingPortMappingsRequest:
      type: object
      required:
      - AcceleratorArn
      title: ListCustomRoutingPortMappingsRequest
      properties:
        AcceleratorArn:
          allOf:
          - $ref: '#/components/schemas/GenericString'
          - description: The Amazon Resource Name (ARN) of the accelerator to list the custom routing port mappings for.
        EndpointGroupArn:
          allOf:
          - $ref: '#/components/schemas/GenericString'
          - description: The Amazon Resource Name (ARN) of the endpoint group to list the custom routing port mappings for.
        MaxResults:
          allOf:
          - $ref: '#/components/schemas/PortMappingsMaxResults'
          - description: The number of destination port mappings that you want to return with this call. The default value is 10.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/GenericString'
          - description: The token for the next set of results. You receive this token from a previous call.
    PortMappings:
      type: array
      items:
        $ref: '#/components/schemas/PortMapping'
    CustomRoutingProtocol:
      type: string
      enum:
      - TCP
      - UDP
    CustomRoutingDestinationTrafficState:
      type: string
      enum:
      - ALLOW
      - DENY
    PortNumber:
      type: integer
      minimum: 1
      maximum: 65535
    AcceleratorNotFoundException: {}
    GenericString:
      type: string
      maxLength: 255
