components:
  schemas:
    GenericBoolean:
      type: boolean
    CustomRoutingAcceleratorAttributes:
      type: object
      properties:
        FlowLogsEnabled:
          allOf:
          - $ref: '#/components/schemas/GenericBoolean'
          - description: <p>Indicates whether flow logs are enabled. The default value is false. If the value is true, <code>FlowLogsS3Bucket</code> and <code>FlowLogsS3Prefix</code> must be specified.</p> <p>For more information, see <a href="https://docs.aws.amazon.com/global-accelerator/latest/dg/monitoring-global-accelerator.flow-logs.html">Flow logs</a> in the <i>Global Accelerator Developer Guide</i>.</p>
        FlowLogsS3Bucket:
          allOf:
          - $ref: '#/components/schemas/GenericString'
          - description: The name of the Amazon S3 bucket for the flow logs. Attribute is required if <code>FlowLogsEnabled</code> is <code>true</code>. The bucket must exist and have a bucket policy that grants Global Accelerator permission to write to the bucket.
        FlowLogsS3Prefix:
          allOf:
          - $ref: '#/components/schemas/GenericString'
          - description: <p>The prefix for the location in the Amazon S3 bucket for the flow logs. Attribute is required if <code>FlowLogsEnabled</code> is <code>true</code>.</p> <p>If you don’t specify a prefix, the flow logs are stored in the root of the bucket. If you specify slash (/) for the S3 bucket prefix, the log file bucket folder structure will include a double slash (//), like the following:</p> <p>DOC-EXAMPLE-BUCKET//AWSLogs/aws_account_id</p>
      description: Attributes of a custom routing accelerator.
    DescribeCustomRoutingAcceleratorAttributesRequest:
      type: object
      required:
      - AcceleratorArn
      title: DescribeCustomRoutingAcceleratorAttributesRequest
      properties:
        AcceleratorArn:
          allOf:
          - $ref: '#/components/schemas/GenericString'
          - description: The Amazon Resource Name (ARN) of the custom routing accelerator to describe the attributes for.
    AcceleratorNotFoundException: {}
    DescribeCustomRoutingAcceleratorAttributesResponse:
      type: object
      properties:
        AcceleratorAttributes:
          allOf:
          - $ref: '#/components/schemas/CustomRoutingAcceleratorAttributes'
          - description: The attributes of the custom routing accelerator.
    InternalServiceErrorException: {}
    InvalidArgumentException: {}
    GenericString:
      type: string
      maxLength: 255
