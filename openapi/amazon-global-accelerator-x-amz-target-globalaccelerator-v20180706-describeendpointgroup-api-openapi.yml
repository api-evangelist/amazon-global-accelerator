components:
  parameters:
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  schemas:
    EndpointGroupNotFoundException: {}
    EndpointGroup:
      type: object
      properties:
        EndpointGroupArn:
          allOf:
          - $ref: '#/components/schemas/GenericString'
          - description: The Amazon Resource Name (ARN) of the endpoint group.
        EndpointGroupRegion:
          allOf:
          - $ref: '#/components/schemas/GenericString'
          - description: The Amazon Web Services Region where the endpoint group is located.
        EndpointDescriptions:
          allOf:
          - $ref: '#/components/schemas/EndpointDescriptions'
          - description: The list of endpoint objects.
        TrafficDialPercentage:
          allOf:
          - $ref: '#/components/schemas/TrafficDialPercentage'
          - description: <p>The percentage of traffic to send to an Amazon Web Services Region. Additional traffic is distributed to other endpoint groups for this listener. </p> <p>Use this action to increase (dial up) or decrease (dial down) traffic to a specific Region. The percentage is applied to the traffic that would otherwise have been routed to the Region based on optimal routing.</p> <p>The default value is 100.</p>
        HealthCheckPort:
          allOf:
          - $ref: '#/components/schemas/HealthCheckPort'
          - description: <p>The port that Global Accelerator uses to perform health checks on endpoints that are part of this endpoint group. </p> <p>The default port is the port for the listener that this endpoint group is associated with. If the listener port is a list, Global Accelerator uses the first specified port in the list of ports.</p>
        HealthCheckProtocol:
          allOf:
          - $ref: '#/components/schemas/HealthCheckProtocol'
          - description: The protocol that Global Accelerator uses to perform health checks on endpoints that are part of this endpoint group. The default value is TCP.
        HealthCheckPath:
          allOf:
          - $ref: '#/components/schemas/HealthCheckPath'
          - description: If the protocol is HTTP/S, then this value provides the ping path that Global Accelerator uses for the destination on the endpoints for health checks. The default is slash (/).
        HealthCheckIntervalSeconds:
          allOf:
          - $ref: '#/components/schemas/HealthCheckIntervalSeconds'
          - description: The time—10 seconds or 30 seconds—between health checks for each endpoint. The default value is 30.
        ThresholdCount:
          allOf:
          - $ref: '#/components/schemas/ThresholdCount'
          - description: The number of consecutive health checks required to set the state of a healthy endpoint to unhealthy, or to set an unhealthy endpoint to healthy. The default value is 3.
        PortOverrides:
          allOf:
          - $ref: '#/components/schemas/PortOverrides'
          - description: 'Allows you to override the destination ports used to route traffic to an endpoint. Using a port override lets you map a list of external destination ports (that your users send traffic to) to a list of internal destination ports that you want an application endpoint to receive traffic on. '
      description: 'A complex type for the endpoint group. An Amazon Web Services Region can have only one endpoint group for a specific listener. '
    InternalServiceErrorException: {}
    HealthState:
      type: string
      enum:
      - INITIAL
      - HEALTHY
      - UNHEALTHY
    EndpointDescriptions:
      type: array
      items:
        $ref: '#/components/schemas/EndpointDescription'
    HealthCheckIntervalSeconds:
      type: integer
      minimum: 10
      maximum: 30
    TrafficDialPercentage:
      type: number
      format: float
      minimum: 0
      maximum: 100
    PortOverride:
      type: object
      properties:
        ListenerPort:
          allOf:
          - $ref: '#/components/schemas/PortNumber'
          - description: The listener port that you want to map to a specific endpoint port. This is the port that user traffic arrives to the Global Accelerator on.
        EndpointPort:
          allOf:
          - $ref: '#/components/schemas/PortNumber'
          - description: The endpoint port that you want a listener port to be mapped to. This is the port on the endpoint, such as the Application Load Balancer or Amazon EC2 instance.
      description: <p>Override specific listener ports used to route traffic to endpoints that are part of an endpoint group. For example, you can create a port override in which the listener receives user traffic on ports 80 and 443, but your accelerator routes that traffic to ports 1080 and 1443, respectively, on the endpoints.</p> <p>For more information, see <a href="https://docs.aws.amazon.com/global-accelerator/latest/dg/about-endpoint-groups-port-override.html"> Overriding listener ports</a> in the <i>Global Accelerator Developer Guide</i>.</p>
    InvalidArgumentException: {}
    EndpointWeight:
      type: integer
      minimum: 0
      maximum: 255
    GenericBoolean:
      type: boolean
    DescribeEndpointGroupRequest:
      type: object
      required:
      - EndpointGroupArn
      title: DescribeEndpointGroupRequest
      properties:
        EndpointGroupArn:
          allOf:
          - $ref: '#/components/schemas/GenericString'
          - description: The Amazon Resource Name (ARN) of the endpoint group to describe.
    HealthCheckPort:
      type: integer
      minimum: 1
      maximum: 65535
    ThresholdCount:
      type: integer
      minimum: 1
      maximum: 10
    HealthCheckPath:
      type: string
      pattern: ^/[-a-zA-Z0-9@:%_\\+.~#?&/=]*$
      maxLength: 255
    PortOverrides:
      type: array
      items:
        $ref: '#/components/schemas/PortOverride'
      minItems: 0
      maxItems: 10
    EndpointDescription:
      type: object
      properties:
        EndpointId:
          allOf:
          - $ref: '#/components/schemas/GenericString'
          - description: <p>An ID for the endpoint. If the endpoint is a Network Load Balancer or Application Load Balancer, this is the Amazon Resource Name (ARN) of the resource. If the endpoint is an Elastic IP address, this is the Elastic IP address allocation ID. For Amazon EC2 instances, this is the EC2 instance ID. </p> <p>An Application Load Balancer can be either internal or internet-facing.</p>
        Weight:
          allOf:
          - $ref: '#/components/schemas/EndpointWeight'
          - description: 'The weight associated with the endpoint. When you add weights to endpoints, you configure Global Accelerator to route traffic based on proportions that you specify. For example, you might specify endpoint weights of 4, 5, 5, and 6 (sum=20). The result is that 4/20 of your traffic, on average, is routed to the first endpoint, 5/20 is routed both to the second and third endpoints, and 6/20 is routed to the last endpoint. For more information, see <a href="https://docs.aws.amazon.com/global-accelerator/latest/dg/about-endpoints-endpoint-weights.html">Endpoint weights</a> in the <i>Global Accelerator Developer Guide</i>. '
        HealthState:
          allOf:
          - $ref: '#/components/schemas/HealthState'
          - description: The health status of the endpoint.
        HealthReason:
          allOf:
          - $ref: '#/components/schemas/GenericString'
          - description: Returns a null result.
        ClientIPPreservationEnabled:
          allOf:
          - $ref: '#/components/schemas/GenericBoolean'
          - description: <p>Indicates whether client IP address preservation is enabled for an endpoint. The value is true or false. The default value is true for new accelerators. </p> <p>If the value is set to true, the client's IP address is preserved in the <code>X-Forwarded-For</code> request header as traffic travels to applications on the endpoint fronted by the accelerator.</p> <p>Client IP address preservation is supported, in specific Amazon Web Services Regions, for endpoints that are Application Load Balancers and Amazon EC2 instances.</p> <p>For more information, see <a href="https://docs.aws.amazon.com/global-accelerator/latest/dg/preserve-client-ip-address.html"> Preserve client IP addresses in Global Accelerator</a> in the <i>Global Accelerator Developer Guide</i>.</p>
      description: A complex type for an endpoint. Each endpoint group can include one or more endpoints, such as load balancers.
    HealthCheckProtocol:
      type: string
      enum:
      - TCP
      - HTTP
      - HTTPS
    DescribeEndpointGroupResponse:
      type: object
      properties:
        EndpointGroup:
          allOf:
          - $ref: '#/components/schemas/EndpointGroup'
          - description: The description of an endpoint group.
    PortNumber:
      type: integer
      minimum: 1
      maximum: 65535
    GenericString:
      type: string
      maxLength: 255
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
